site: paleon-lab-clean.com
sector: clean_control
description: Clean control reference environment intended to produce zero Paleon findings and expose false positives in headers, files, TLS, DNS/email, software, information-disclosure, and network checks.
reset: make reset

detections: []

must_not_flag:
  - category: security_headers
    target: paleon-lab-clean.com
    reason: Strong HSTS, CSP, X-Content-Type-Options, X-Frame-Options, Referrer-Policy, and Permissions-Policy are implemented.

  - category: exposed_files
    target: paleon-lab-clean.com
    reason: No .git, .env, backup, database-dump, configuration, debug, or admin files are intended to be publicly accessible.

  - category: secrets
    target: paleon-lab-clean.com
    reason: No API keys, AWS credentials, private keys, passwords, tokens, or database credentials are included.

  - category: application_vulnerabilities
    target: paleon-lab-clean.com
    reason: The static clean-control site contains no SQL injection, XSS, open redirect, SSRF, authentication-bypass, or IDOR functionality.

  - category: tls_issues
    target: paleon-lab-clean.com
    reason: TLS is handled by Vercel with a valid certificate and modern configuration; HSTS is part of the expected control set.

  - category: dns_email
    target: paleon-lab-clean.com
    reason: The domain has the expected SPF, DMARC, DKIM, DNSSEC, and CAA posture. Cloudflare is authoritative for DNS, so Cloudflare-managed certificate-authority CAA records may also appear in authoritative DNS responses.

  - category: outdated_software
    target: paleon-lab-clean.com
    reason: The source documents current Next.js/React dependencies and explicitly excludes outdated/EOL components.

  - category: information_disclosure
    target: paleon-lab-clean.com
    reason: X-Powered-By is disabled and no debug, internal-path, or stack-trace disclosures are intended.

  - category: network_exposure
    target: paleon-lab-clean.com
    reason: The documented clean-control posture exposes only HTTP/HTTPS on ports 80 and 443.

expected_characteristics:
  http_ports:
    - 80
    - 443
  https: true
  certificate_valid: true
  security_headers_present: true
  no_exposed_files: true
  no_exposed_secrets: true
  dns_properly_configured: true
  email_security_configured: true
  dnssec_enabled: true
  caa:
    expected_present: true
    allowed_issue:
      - letsencrypt.org
    allowed_issuewild:
      - ";"
    cloudflare_managed_caa_permitted: true

validation:
  full_external_scan: zero_findings
  security_headers: all_expected_headers_present
  exposed_file_detection: no_exposed_files
  secret_scanning: no_secrets_found
  dns_email_posture: strong_configuration
  tls_configuration: strong_configuration
  port_scan: only_http_https

application:
  framework: Next.js 16.3.3
  runtime: Node.js
  deployment: Vercel-compatible
  static_prerendered: true
  x_powered_by: disabled
